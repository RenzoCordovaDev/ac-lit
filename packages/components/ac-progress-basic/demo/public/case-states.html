<section>
  <h2>Indeterminado</h2>
  <div class="row">
    <ac-progress-basic data-testid="progress-indeterminate" indeterminate></ac-progress-basic>
  </div>
</section>

<section>
  <h2>Con <code>label</code></h2>
  <div class="row">
    <ac-progress-basic
      data-testid="progress-label"
      label="Subiendo archivo"
      value="30"
    ></ac-progress-basic>
  </div>
</section>

<section>
  <h2>Con <code>show-value</code></h2>
  <div class="row">
    <ac-progress-basic data-testid="progress-show-value" value="65" show-value></ac-progress-basic>
  </div>
</section>

<section>
  <h2>Con <code>label</code> y <code>show-value</code></h2>
  <div class="row">
    <ac-progress-basic
      data-testid="progress-label-show-value"
      label="Descargando"
      value="80"
      show-value
    ></ac-progress-basic>
  </div>
</section>
