<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ac-link-basic demo</title>
    <script type="module" src="./demo.js"></script>
    <link rel="stylesheet" href="./demo-base.css" />
  </head>
  <body>
    <div class="demo-root">
      <h1>&lt;ac-link-basic&gt;</h1>

      <section>
        <h2>Variantes</h2>
        <div class="row">
          <ac-link-basic variant="primary" href="#variantes">Primary</ac-link-basic>
          <ac-link-basic variant="primary-alt" href="#variantes">Primary alt</ac-link-basic>
          <ac-link-basic variant="secondary" href="#variantes">Secondary</ac-link-basic>
          <ac-link-basic variant="secondary-alt" href="#variantes">Secondary alt</ac-link-basic>
        </div>
      </section>

      <section>
        <h2>Estados</h2>
        <div class="row">
          <ac-link-basic data-testid="link-disabled" href="#estados" disabled
            >Disabled</ac-link-basic
          >
          <ac-link-basic href="https://lit.dev" target="_blank"
            >Abre en nueva pestaña</ac-link-basic
          >
        </div>
      </section>

      <section>
        <h2>i18n (texto desde locales.json)</h2>
        <div class="controls">
          <label
            >Locale
            <select id="locale-select">
              <option value="es-PE">es-PE</option>
              <option value="en-EN">en-EN</option>
              <option value="pt-BR">pt-BR</option>
            </select>
          </label>
        </div>
        <div class="row">
          <ac-link-basic text="link-basic-learn-more" href="#i18n"></ac-link-basic>
        </div>
      </section>

      <section>
        <h2>Eventos (<code>ac-link-basic-click</code>)</h2>
        <div class="row">
          <ac-link-basic data-testid="link-enabled" href="#eventos">Click me</ac-link-basic>
        </div>
        <div id="event-log"></div>
      </section>
    </div>
  </body>
</html>
