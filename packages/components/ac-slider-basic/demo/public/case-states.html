<section>
  <h2>Deshabilitado</h2>
  <ac-slider-basic
    data-testid="slider-disabled"
    label="Bloqueado"
    value="60"
    show-value
    disabled
  ></ac-slider-basic>
</section>

<section>
  <h2>Sin etiqueta visible (<code>a11y-label</code>)</h2>
  <ac-slider-basic data-testid="slider-a11y-label" a11y-label="Zoom" value="25"></ac-slider-basic>
</section>

<section>
  <h2>En los extremos</h2>
  <ac-slider-basic data-testid="slider-min" label="Mínimo" value="0" show-value></ac-slider-basic>
  <ac-slider-basic data-testid="slider-max" label="Máximo" value="100" show-value></ac-slider-basic>
</section>
