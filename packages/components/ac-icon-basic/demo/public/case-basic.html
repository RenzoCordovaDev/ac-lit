<section>
  <h2>Todos los íconos</h2>
  <div class="row icon-grid">
    <div class="icon-grid__item">
      <ac-icon-basic data-testid="icon-check" name="check"></ac-icon-basic>
      <span>check</span>
    </div>
    <div class="icon-grid__item">
      <ac-icon-basic data-testid="icon-close" name="close"></ac-icon-basic>
      <span>close</span>
    </div>
    <div class="icon-grid__item">
      <ac-icon-basic data-testid="icon-info" name="info"></ac-icon-basic>
      <span>info</span>
    </div>
    <div class="icon-grid__item">
      <ac-icon-basic data-testid="icon-success" name="success"></ac-icon-basic>
      <span>success</span>
    </div>
    <div class="icon-grid__item">
      <ac-icon-basic data-testid="icon-warning" name="warning"></ac-icon-basic>
      <span>warning</span>
    </div>
    <div class="icon-grid__item">
      <ac-icon-basic data-testid="icon-danger" name="danger"></ac-icon-basic>
      <span>danger</span>
    </div>
    <div class="icon-grid__item">
      <ac-icon-basic data-testid="icon-chevron-down" name="chevron-down"></ac-icon-basic>
      <span>chevron-down</span>
    </div>
    <div class="icon-grid__item">
      <ac-icon-basic data-testid="icon-chevron-up" name="chevron-up"></ac-icon-basic>
      <span>chevron-up</span>
    </div>
    <div class="icon-grid__item">
      <ac-icon-basic data-testid="icon-chevron-left" name="chevron-left"></ac-icon-basic>
      <span>chevron-left</span>
    </div>
    <div class="icon-grid__item">
      <ac-icon-basic data-testid="icon-chevron-right" name="chevron-right"></ac-icon-basic>
      <span>chevron-right</span>
    </div>
    <div class="icon-grid__item">
      <ac-icon-basic data-testid="icon-search" name="search"></ac-icon-basic>
      <span>search</span>
    </div>
    <div class="icon-grid__item">
      <ac-icon-basic data-testid="icon-menu" name="menu"></ac-icon-basic>
      <span>menu</span>
    </div>
    <div class="icon-grid__item">
      <ac-icon-basic data-testid="icon-arrow-left" name="arrow-left"></ac-icon-basic>
      <span>arrow-left</span>
    </div>
    <div class="icon-grid__item">
      <ac-icon-basic data-testid="icon-arrow-right" name="arrow-right"></ac-icon-basic>
      <span>arrow-right</span>
    </div>
  </div>
</section>

<section>
  <h2>Tamaños</h2>
  <div class="row">
    <ac-icon-basic data-testid="icon-size-sm" name="check" size="sm"></ac-icon-basic>
    <ac-icon-basic data-testid="icon-size-md" name="check" size="md"></ac-icon-basic>
    <ac-icon-basic data-testid="icon-size-lg" name="check" size="lg"></ac-icon-basic>
  </div>
</section>

<section>
  <h2>Fallback y accesibilidad</h2>
  <div class="row">
    <div class="icon-grid__item">
      <ac-icon-basic data-testid="icon-fallback" name="nombre-inexistente"></ac-icon-basic>
      <span>name inválido (fallback)</span>
    </div>
    <div class="icon-grid__item">
      <ac-icon-basic
        data-testid="icon-a11y-label"
        name="warning"
        a11y-label="Advertencia"
      ></ac-icon-basic>
      <span>a11y-label="Advertencia" (no decorativo)</span>
    </div>
  </div>
</section>
