<section>
  <h2>Con etiqueta y ayuda</h2>
  <ac-textarea-basic
    data-testid="textarea-comment"
    label="Comentario"
    name="comment"
    placeholder="Contanos qué pasó"
    hint="Máximo 500 caracteres."
  ></ac-textarea-basic>
</section>

<section>
  <h2>Alto personalizado (<code>rows</code>)</h2>
  <ac-textarea-basic
    data-testid="textarea-rows"
    label="Mensaje largo"
    name="message"
    rows="8"
  ></ac-textarea-basic>
</section>

<section>
  <h2>i18n (claves de locales.json)</h2>
  <ac-textarea-basic
    data-testid="textarea-i18n"
    label="textarea-basic-comment-label"
    placeholder="textarea-basic-comment-placeholder"
    hint="textarea-basic-comment-hint"
  ></ac-textarea-basic>
</section>
