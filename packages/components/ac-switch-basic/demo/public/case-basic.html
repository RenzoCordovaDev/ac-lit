<section>
  <h2>Interruptor simple</h2>
  <div class="row">
    <ac-switch-basic data-testid="switch-wifi" name="wifi" value="on">Wi-Fi</ac-switch-basic>
    <ac-switch-basic data-testid="switch-on" name="bluetooth" value="on" checked
      >Bluetooth (encendido)</ac-switch-basic
    >
  </div>
</section>

<section>
  <h2>i18n (texto desde locales.json)</h2>
  <div class="row">
    <ac-switch-basic
      data-testid="switch-i18n"
      text="switch-basic-notifications"
      name="notifications"
    ></ac-switch-basic>
  </div>
</section>
