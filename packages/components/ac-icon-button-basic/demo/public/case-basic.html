<section>
  <h2>Ambients</h2>
  <div class="row">
    <ac-icon-button-basic
      data-testid="icon-button-ambient-primary"
      name="close"
      a11y-label="Cerrar"
      ambient="primary"
    ></ac-icon-button-basic>
    <ac-icon-button-basic
      data-testid="icon-button-ambient-secondary"
      name="close"
      a11y-label="Cerrar"
      ambient="secondary"
    ></ac-icon-button-basic>
    <ac-icon-button-basic
      data-testid="icon-button-ambient-danger"
      name="close"
      a11y-label="Cerrar"
      ambient="danger"
    ></ac-icon-button-basic>
  </div>
</section>

<section>
  <h2>Tamaños</h2>
  <div class="row">
    <ac-icon-button-basic
      data-testid="icon-button-size-sm"
      name="search"
      a11y-label="Buscar"
      size="sm"
    ></ac-icon-button-basic>
    <ac-icon-button-basic
      data-testid="icon-button-size-md"
      name="search"
      a11y-label="Buscar"
      size="md"
    ></ac-icon-button-basic>
    <ac-icon-button-basic
      data-testid="icon-button-size-lg"
      name="search"
      a11y-label="Buscar"
      size="lg"
    ></ac-icon-button-basic>
  </div>
</section>

<section>
  <h2>Grilla de íconos (toolbar de acciones)</h2>
  <div class="row icon-grid">
    <div class="icon-grid__item">
      <ac-icon-button-basic
        data-testid="icon-button-close"
        name="close"
        a11y-label="Cerrar"
      ></ac-icon-button-basic>
      <span>close</span>
    </div>
    <div class="icon-grid__item">
      <ac-icon-button-basic
        data-testid="icon-button-search"
        name="search"
        a11y-label="Buscar"
      ></ac-icon-button-basic>
      <span>search</span>
    </div>
    <div class="icon-grid__item">
      <ac-icon-button-basic
        data-testid="icon-button-menu"
        name="menu"
        a11y-label="Abrir menú"
      ></ac-icon-button-basic>
      <span>menu</span>
    </div>
    <div class="icon-grid__item">
      <ac-icon-button-basic
        data-testid="icon-button-chevron-right"
        name="chevron-right"
        a11y-label="Siguiente"
      ></ac-icon-button-basic>
      <span>chevron-right</span>
    </div>
  </div>
</section>

<section>
  <h2>Estados</h2>
  <div class="row">
    <ac-icon-button-basic
      data-testid="icon-button-disabled"
      name="close"
      a11y-label="Cerrar"
      disabled
    ></ac-icon-button-basic>
  </div>
</section>

<section>
  <h2>Accesibilidad — fallback de <code>aria-label</code></h2>
  <div class="row icon-grid">
    <div class="icon-grid__item">
      <ac-icon-button-basic
        data-testid="icon-button-fallback-label"
        name="close"
      ></ac-icon-button-basic>
      <span>sin a11y-label (usa name="close")</span>
    </div>
  </div>
</section>

<section>
  <h2>Eventos (click nativo)</h2>
  <div class="row">
    <ac-icon-button-basic
      data-testid="icon-button-click-target"
      name="chevron-right"
      a11y-label="Siguiente"
    ></ac-icon-button-basic>
    <span>Clicks: <strong data-testid="icon-button-click-count">0</strong></span>
  </div>
</section>
