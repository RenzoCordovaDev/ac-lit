<section>
  <h2>Foco de teclado</h2>
  <p>
    El globo también se muestra al enfocar el trigger con teclado (<kbd>Tab</kbd>), no solo con el
    mouse — presiona <kbd>Tab</kbd> hasta llegar al botón y <kbd>Escape</kbd> para ocultarlo.
  </p>
  <div class="row">
    <ac-tooltip-basic data-testid="tooltip-keyboard" text="Se muestra con Tab">
      <button>Enfócame con Tab</button>
    </ac-tooltip-basic>
  </div>
</section>
