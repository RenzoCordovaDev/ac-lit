<section>
  <h2>Con etiqueta y ayuda</h2>
  <ac-input-basic
    data-testid="input-name"
    label="Nombre"
    name="name"
    placeholder="Tu nombre"
    hint="Como aparece en tu documento."
  ></ac-input-basic>
</section>

<section>
  <h2>Tipos</h2>
  <ac-input-basic
    data-testid="input-email"
    label="Correo"
    type="email"
    name="email"
    value="ana@example.com"
  ></ac-input-basic>
  <ac-input-basic
    data-testid="input-password"
    label="Contraseña"
    type="password"
    name="password"
  ></ac-input-basic>
</section>

<section>
  <h2>i18n (claves de locales.json)</h2>
  <ac-input-basic
    data-testid="input-i18n"
    label="input-basic-email-label"
    placeholder="input-basic-email-placeholder"
    hint="input-basic-email-hint"
    type="email"
  ></ac-input-basic>
</section>
