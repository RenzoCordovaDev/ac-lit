<!doctype html>
<html lang="es" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Catálogo de componentes — ac-lit</title>
    <link rel="stylesheet" href="./tokens/base.css" />
    <link rel="stylesheet" href="./tokens/modern-warm-palette.css" />
    <link rel="stylesheet" href="./tokens/modern-warm-palette-light.css" />
    <link rel="stylesheet" href="./catalog.css" />
    <script type="module" src="./catalog.js"></script>
  </head>
  <body>
    <header class="catalog__header">
      <button type="button" class="catalog__brand" id="catalog-home-link">
        <span class="catalog__name">ac-lit</span>
        <span class="catalog__tech-badge">Lit v3</span>
      </button>
      <h2 class="catalog__page-title" id="catalog-page-title" hidden>Catálogo de componentes</h2>
      <div class="catalog__header-meta">
        <a
          class="catalog__docs-link"
          href="https://github.com/RenzoCordovaDev/ac-lit"
          target="_blank"
          rel="noopener"
          >Repositorio</a
        >
        <div class="catalog__segmented catalog__theme-switcher" role="group" aria-label="Tema">
          <button
            type="button"
            class="catalog__segmented-button"
            data-theme-value="light"
            aria-pressed="true"
            aria-label="Modo claro"
          >
            <svg
              viewBox="0 0 24 24"
              width="15"
              height="15"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <circle cx="12" cy="12" r="4" />
              <path
                d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"
              />
            </svg>
          </button>
          <span class="catalog__segmented-divider"></span>
          <button
            type="button"
            class="catalog__segmented-button"
            data-theme-value="dark"
            aria-pressed="false"
            aria-label="Modo oscuro"
          >
            <svg
              viewBox="0 0 24 24"
              width="15"
              height="15"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z" />
            </svg>
          </button>
        </div>
      </div>
    </header>

    <main class="catalog__home" id="view-home">
      <div class="catalog__home-content">
        <span class="catalog__tech-badge">Lit v3</span>
        <h1 class="catalog__home-title">Bienvenido a ac-lit</h1>
        <p class="catalog__home-text">
          Un catálogo de Web Components listos para usar, con la demo real e interactiva de cada uno
          — elige un componente y pruébalo en los dos temas, en distintos tamaños de pantalla, con
          su código fuente a la vista.
        </p>
        <button type="button" class="catalog__cta" id="catalog-cta">
          Ver catálogo de componentes
        </button>
      </div>
    </main>

    <div class="catalog__body" id="view-catalog" hidden>
      <nav class="catalog__sidebar" aria-label="Lista de componentes">
        <label class="catalog__search-field">
          <span class="catalog__visually-hidden">Buscar componente</span>
          <input
            type="search"
            class="catalog__search-input"
            placeholder="Buscar..."
            autocomplete="off"
          />
        </label>
        <ul class="catalog__list" id="catalog-list" aria-live="polite"></ul>
      </nav>

      <main class="catalog__main">
        <p class="catalog__empty-state" id="catalog-empty">Cargando catálogo…</p>
        <div class="catalog__skeleton" id="catalog-skeleton" hidden>
          <div class="catalog__skeleton-line"></div>
          <div class="catalog__skeleton-line"></div>
          <div class="catalog__skeleton-line"></div>
        </div>
        <iframe
          class="catalog__frame"
          id="catalog-frame"
          title="Demo del componente seleccionado"
          hidden
        ></iframe>
      </main>
    </div>
  </body>
</html>
