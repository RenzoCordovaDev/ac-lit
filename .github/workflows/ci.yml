name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    env:
      # Ref contra el que se calculan los paquetes afectados (ver
      # scripts/affected.mjs y "CI es la validación completa..." en
      # docs/CONVENTIONS.md). En un PR, la base real es `origin/<base_ref>`
      # (normalmente `origin/main`); en un push directo a `main` (post-merge),
      # es el commit previo de `main` (`github.event.before`) — diffear
      # contra `origin/main` en ese caso compararía main contra sí mismo (0
      # paquetes afectados) y dejaría sin validar lo que el push acaba de
      # traer.
      AFFECTED_BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Historia completa: pnpm necesita poder resolver el merge-base
          # contra `origin/main` (o el commit previo, en un push) para
          # calcular los paquetes afectados. `actions/checkout` solo trae el
          # último commit por defecto, lo que rompería ese cálculo.
          fetch-depth: 0

      - name: Fetch main para calcular paquetes afectados
        run: git fetch origin main

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    # No bloqueante todavía: no es (ni debe agregarse a) un required status check
    # de `main` hasta que la suite demuestre estabilidad en varias corridas.
    continue-on-error: true
    env:
      AFFECTED_BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch main para calcular paquetes afectados
        run: git fetch origin main

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: E2E tests
        run: pnpm test:e2e

      - name: Accessibility tests
        run: pnpm test:e2e:a11y
