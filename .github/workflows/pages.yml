name: Pages

# Reconstruye y redespliega el catálogo visual de componentes en cada push a
# `main` -- un componente nuevo agregado al catálogo aparece solo, sin tocar
# ningún archivo de este workflow ni del sitio.
#
# `workflow_dispatch` permite dispararlo a mano desde la pestaña Actions,
# para validar el pipeline completo (build + deploy) antes de confiar en el
# disparador automático por push.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar pnpm
        uses: pnpm/action-setup@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Armar el catálogo
        run: pnpm catalog:build

      - name: Subir el artefacto de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: catalog-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
